# Copy to local.yml and fill in. local.yml is ignored by git.
settings:
  base:
    DEVELOPMENT_TEAM: YOURTEAMID          # your Apple developer team ID
    VAULT_SYNC_URL: https://your-domain.example/vault-sync/v/   # where you deployed sync-worker; leave empty to turn sync off
targets: {}

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vault</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 360px; min-height: 200px; max-height: 580px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px; }
  .state { display: flex; align-items: center; gap: 6px; }
  nav { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 16px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  nav button { all: unset; cursor: pointer; text-align: center; padding: 9px 0; font: 500 11px/1 "Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  nav button + button { border-left: 1px solid var(--line); }
  nav button[aria-selected="true"] { color: var(--amber); background: var(--amber-fill); }
  nav button:hover { color: var(--text); }
  main { padding: 12px 8px 12px; }
  .pad { padding: 0 8px; }
  .sub { padding: 4px 8px 8px; }
  .list { max-height: 400px; overflow: auto; }
  .acts { display: flex; gap: 2px; align-items: center; }
  .otp { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 0 -6px; padding: 3px 6px; border-radius: 5px; }
  .otp:hover { background: var(--amber-fill); }
  .otp .eyebrow { font-size: 10px; }
  .ib { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 5px; color: var(--muted); }
  .ib:hover { color: var(--text); background: var(--panel-hi); }
  .ib:focus-visible { outline: 2px solid var(--amber); }
  .empty { padding: 18px 8px; color: var(--mid); }
  .hero { padding: 16px 8px 8px; }
  .hero h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
  .hero p { margin: 0 0 16px; color: var(--mid); }
  .pair { font: 500 30px/1 "Plex Mono", monospace; letter-spacing: .12em; color: var(--amber); padding: 18px 16px; border: 1px solid var(--amber-line);
    background: var(--amber-fill); border-radius: 6px; margin-bottom: 12px; }
  .gen { font: 500 17px/1.45 "Plex Mono", monospace; word-break: break-all; padding: 14px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); min-height: 76px; }
  .opts { display: grid; gap: 0; margin: 10px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  .opt { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; min-height: 44px; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 6px 10px; font: 500 11px/1 "Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .seg button[aria-pressed="true"] { color: var(--amber); background: var(--amber-fill); }
  input[type=range] { accent-color: var(--amber); width: 150px; }
  .switch { appearance: none; width: 36px; height: 22px; border-radius: 11px; background: var(--line); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--mid); transition: transform .15s, background .15s; }
  .switch:checked { background: var(--amber-line); }
  .switch:checked::after { transform: translateX(14px); background: var(--amber); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .strength { display: flex; justify-content: space-between; margin-top: 8px; }
  .qr { width: 220px; height: 220px; margin: 6px auto 0; border-radius: 8px; overflow: hidden; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
</style></head>
<body>
  <header>
    <span class="eyebrow">Vault</span>
    <span class="state"><span class="dot" id="dot"></span><span class="eyebrow" id="state">…</span></span>
  </header>
  <div id="app"></div>
<script src="vendor/qrcode.js"></script><script src="common.js"></script><script src="popup.js"></script></body></html>
